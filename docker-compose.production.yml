services:
  app:
    env_file:
      - ${GOOGLE_ROUTES_ENV_FILE}
    environment:
      APP_ENV: production
      AUTH_MODE: ${AUTH_MODE:-cloudflare_access}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD}
      PROJECT_MASTER_TENANT_ID: ${PROJECT_MASTER_TENANT_ID}
      PROJECT_MASTER_SITE_ID: ${PROJECT_MASTER_SITE_ID}
      PROJECT_MASTER_LIST_ID: ${PROJECT_MASTER_LIST_ID}
      PROJECT_MASTER_COLUMN_MAP: ${PROJECT_MASTER_COLUMN_MAP}
      STORAGE_DRIVER: filesystem
      STORAGE_ROOT: /data/documents
      GOOGLE_ROUTES_RETENTION_CONFIRMED: ${GOOGLE_ROUTES_RETENTION_CONFIRMED:-false}
      GOOGLE_PLACES_ENABLED_CONFIRMED: ${GOOGLE_PLACES_ENABLED_CONFIRMED:-false}
      GOOGLE_PLACES_MONTHLY_HARD_CAP: ${GOOGLE_PLACES_MONTHLY_HARD_CAP:-8500}
      GOOGLE_ROUTES_MONTHLY_HARD_CAP: ${GOOGLE_ROUTES_MONTHLY_HARD_CAP:-8500}
      PRODUCTION_RESTORE_ACCEPTED: ${PRODUCTION_RESTORE_ACCEPTED:-false}
      PRODUCTION_CUTOVER_APPROVED: ${PRODUCTION_CUTOVER_APPROVED:-false}
    volumes:
      - ${DOCUMENTS_HOST_PATH:-/srv/infinity-employee/documents}:/data/documents
      - ${OUTLOOK_CALENDAR_CLIENT_PRIVATE_KEY_HOST_PATH:-/home/ubuntu/ies-secrets/outlook/calendar-sync.key.pem}:/run/secrets/outlook/client.key:ro
      - ${OUTLOOK_CALENDAR_CLIENT_CERT_HOST_PATH:-/home/ubuntu/ies-secrets/outlook/calendar-sync.crt.pem}:/run/secrets/outlook/client.crt:ro

  worker:
    env_file:
      - ${GOOGLE_ROUTES_ENV_FILE}
    environment:
      APP_ENV: production
      PROJECT_MASTER_TENANT_ID: ${PROJECT_MASTER_TENANT_ID}
      PROJECT_MASTER_SITE_ID: ${PROJECT_MASTER_SITE_ID}
      PROJECT_MASTER_LIST_ID: ${PROJECT_MASTER_LIST_ID}
      PROJECT_MASTER_COLUMN_MAP: ${PROJECT_MASTER_COLUMN_MAP}
      STORAGE_DRIVER: filesystem
      STORAGE_ROOT: /data/documents
      GOOGLE_ROUTES_RETENTION_CONFIRMED: ${GOOGLE_ROUTES_RETENTION_CONFIRMED:-false}
      GOOGLE_PLACES_ENABLED_CONFIRMED: ${GOOGLE_PLACES_ENABLED_CONFIRMED:-false}
      GOOGLE_PLACES_MONTHLY_HARD_CAP: ${GOOGLE_PLACES_MONTHLY_HARD_CAP:-8500}
      GOOGLE_ROUTES_MONTHLY_HARD_CAP: ${GOOGLE_ROUTES_MONTHLY_HARD_CAP:-8500}
    volumes:
      - ${DOCUMENTS_HOST_PATH:-/srv/infinity-employee/documents}:/data/documents
      - ${OUTLOOK_CALENDAR_CLIENT_PRIVATE_KEY_HOST_PATH:-/home/ubuntu/ies-secrets/outlook/calendar-sync.key.pem}:/run/secrets/outlook/client.key:ro
      - ${OUTLOOK_CALENDAR_CLIENT_CERT_HOST_PATH:-/home/ubuntu/ies-secrets/outlook/calendar-sync.crt.pem}:/run/secrets/outlook/client.crt:ro
